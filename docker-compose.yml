services:

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_BASE_URL: "http://144.24.106.68:5001"
    image: vsc-frontend:dev
    container_name: vsc-frontend
    ports:
      - "8080:80"
    depends_on:
      - customer-booking
      - job-maintenance

  customer-booking:
    build:
      context: ./services/CustomerBookingService
    image: vsc-customer-booking:dev
    container_name: vsc-customer-booking
    ports:
      - "5001:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Staging
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__DefaultConnection: "Server=mysql;Port=3306;Database=customer_booking_db;User=vsc_app;Password=${MYSQL_PASSWORD}"
      Jwt__Key: "${JWT_KEY}"
      Jwt__Issuer: "VehicleServiceCenter"
      Jwt__Audience: "VehicleServiceCenterClients"
      Kafka__BootstrapServers: "kafka:29092"
    depends_on:
      - kafka
      - mysql

  job-maintenance:
    build:
      context: ./services/JobMaintenanceService
    image: vsc-job-maintenance:dev
    container_name: vsc-job-maintenance
    ports:
      - "5002:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Staging
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__DefaultConnection: "Server=mysql;Port=3306;Database=job_maintenance_db;User=vsc_app;Password=${MYSQL_PASSWORD}"
      Jwt__Key: "${JWT_KEY}"
      Jwt__Issuer: "VehicleServiceCenter"
      Jwt__Audience: "VehicleServiceCenterClients"
      Kafka__BootstrapServers: "kafka:29092"
    depends_on:
      - kafka
      - mysql

  kafka:
    image: confluentinc/cp-kafka:8.3.0
    container_name: vsc-kafka
    hostname: kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_LISTENERS: PLAINTEXT://kafka:29092,CONTROLLER://kafka:29093,PLAINTEXT_HOST://0.0.0.0:9092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:29093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk

  mysql:
    image: mysql:8.4
    container_name: vsc-mysql
    environment:
      MYSQL_ROOT_PASSWORD: "${MYSQL_ROOT_PASSWORD}"
      MYSQL_DATABASE: customer_booking_db
      MYSQL_USER: vsc_app
      MYSQL_PASSWORD: "${MYSQL_PASSWORD}"
    volumes:
      - vsc-mysql-data:/var/lib/mysql
    restart: unless-stopped

volumes:
  vsc-mysql-data:
