global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:

  - job_name: customer-booking
    metrics_path: /metrics
    static_configs:
      - targets:
          - customer-booking:8080

  - job_name: job-maintenance
    metrics_path: /metrics
    static_configs:
      - targets:
          - job-maintenance:8080

  - job_name: inventory
    metrics_path: /metrics
    static_configs:
      - targets:
          - inventory:8080

  - job_name: billing
    metrics_path: /metrics
    static_configs:
      - targets:
          - billing:8080

  - job_name: notification
    metrics_path: /metrics
    static_configs:
      - targets:
          - notification:8080
