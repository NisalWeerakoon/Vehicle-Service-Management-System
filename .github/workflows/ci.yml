name: CI Pipeline

on:
  push:
    branches: [ develop, main,production ]
  pull_request:
    branches: [ develop, main,production ]

jobs:
  backend:
    name: Backend Build & Test (.NET 10)
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Setup .NET 10 SDK
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '10.0.x'

    - name: Restore Dependencies
      run: dotnet restore VehicleServiceCenter.slnx

    - name: Build Solution
      run: dotnet build VehicleServiceCenter.slnx --no-restore --configuration Release

    - name: Run Tests
      run: dotnet test VehicleServiceCenter.slnx --no-build --configuration Release --verbosity normal

  frontend:
    name: Frontend Build (React & Vite)
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20.x'
        cache: 'npm'
        cache-dependency-path: frontend/package-lock.json

    - name: Install Dependencies
      working-directory: ./frontend
      run: npm ci

    - name: Build Frontend
      working-directory: ./frontend
      run: npm run build